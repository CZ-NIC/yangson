image: python:latest

stages:
  - test
  - build-docs
  - publish-docs

before_script:
  - apt update
  - apt install -yqq git make
  - pip install uv
  - uv sync --locked --all-groups

test:
  stage: test
  script:
    - make test
    - cd docs
    - uv run --all-groups make doctest

build-docs:
  stage: build-docs
  script:
    - cd docs
    - uv run --all-groups make html
  artifacts:
    paths:
      - docs/_build/html

pages:
  stage: publish-docs
  dependencies:
    - build-docs
  script:
    - mv docs/_build/html public
  artifacts:
    paths:
      - public
  only:
    - tags
