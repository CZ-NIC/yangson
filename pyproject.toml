[project]
name = "yangson"
description = "Library for working with data modelled in YANG"
license = "LGPL-3.0-or-later"
version = "1.7.9"
readme = "README.md"
authors = [{name = "Ladislav Lhotka", email = "ladislav@lhotka.name"}]
requires-python = '>=3.10,<4.0'
dependencies = [
    'elementpath (>=5.1.1,<6.0.0)',
    'PyYAML (>=6.0.1,<7.0.0)',
]

[project.scripts]
yangson = "yangson.__main__:main"
convert8525 = "yangson.convert8525:main"

[dependency-groups]
dev = ["pytest>=9.0.3,<10.0.0", "ruff>=0.17.3"]
yang = ["pyang>=2.7.1,<3.0"]
docs = [
    "sphinx>=7.2.6,<8.0.0",
    "sphinx-rtd-theme>=1.3.0,<2.0.0",
    "sphinxcontrib-shtest>=0.5.0,<0.6.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
